# Served by the nginx stage of the Dockerfile at /etc/nginx/conf.d/default.conf.
#
# This is the configuration Coolify held in its own UI as
# `custom_nginx_configuration` while the app was on the `static` build pack,
# moved into the repo so the serving behavior is reviewable in a pull request
# rather than living in a database. Keep them identical if both are ever live
# at once.
# nginx:alpine ships `#gzip on;` COMMENTED OUT in its stock nginx.conf, so
# without this block every byte here goes out uncompressed. That is not a
# rounding error on this site — the tools are mostly one big JSON each:
#
#   noblogs/data.json            17.57 MB -> 5.59 MB   (68%)
#   ea-explorer/words/data.json   6.18 MB -> 1.73 MB   (72%)
#   noblogs/map_data.js           3.85 MB -> 0.84 MB   (78%)
#
# `gzip_vary` is load-bearing with Cloudflare in front: without it a cache can
# hand a gzipped body to a client that did not ask for one. text/html is always
# compressed and cannot be named in gzip_types.
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/geo+json
    image/svg+xml
    application/manifest+json;

server {
    listen 80;
    server_name _;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Jekyll writes a directory per route (/about/index.html), so `$uri/`
        # is what resolves a clean URL. The /index.html fallback is last and
        # deliberate: it keeps a deep link working rather than returning
        # nginx's own error page.
        try_files $uri $uri/ /index.html;
    }

    error_page 404 = @handle_404;

    location @handle_404 {
        root /usr/share/nginx/html;
        try_files /404.html =404;
        internal;
    }
}
