# The tools index — the single source of truth for what the site offers.
#
# This replaces a structure that used to be written out three times: the link
# list in _includes/header.html, the `page.url contains` active-state
# conditions next to it, and the product-category blocks in index.html. Adding
# a tool now means adding one entry here.
#
# Fields
#   href         route, with a trailing slash
#   name         card title
#   tagline      one line under the title, sentence case, no full stop
#   description  two lines at most; shown on feature cards and as the
#                meta description hint
#   rank         manual order for the "Featured" sort
#   updated      ISO date, taken from the last commit touching the tool's
#                directory. `git log -1 --format=%ad --date=short -- <dir>`
#                Keep it honest — it drives the default sort.
#   launched     ISO date the tool went up, shown on the card as month and
#                year. The first commit of its page:
#                `git log --reverse --format=%ad --date=short -- <dir> | head -1`
#                For a tool rebuilt for a new cycle, the date of the rebuild.
#   category     grouping for the "Category" sort. Mirrors the old subnav.
#   preview      filename under assets/images/products/
#   feature      true renders the tall card with copy overlaid on the image.
#                Keep it to four, so the top block reads as an even 2x2.
#   badge        optional pill above the card title, e.g. "New"

