title: DataRepublican
tagline: Mapping the connections they don’t want you to know about
description: Tracking where the money goes
baseurl: ""
url: "https://datarepublican.com"
destination: docs

defaults:
  # `compact` shrinks the masthead to one line and drops the tagline. Tools get
  # it by default and the five narrative pages opt out, because there are
  # fifteen tools and five of these — and a tool added later should get the
  # compact chrome without anyone remembering to ask for it.
  - scope:
      path: ""
    values:
      image: /assets/images/og.png
      compact: true

  - scope:
      path: index.html
    values:
      compact: false
  - scope:
      path: about
    values:
      compact: false
  - scope:
      path: donate
    values:
      compact: false
  - scope:
      path: policies
    values:
      compact: false
  - scope:
      path: christianity
    values:
      compact: false

social: 
  name: DataRepublican

development:
  url: "http://localhost:4000"
  server_options:
    headers:
      Cache-Control: no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0
    
production:
  url: "https://datarepublican.com"
  
include:
  - florida

favicon: /assets/images/favicon.png

exclude:
  # `bundle install --path vendor/bundle`, which is what ruby/setup-ruby's
  # bundler-cache does, puts the gems inside the source tree. Jekyll then scans
  # them and chokes on its own gem's site template, whose front matter has a
  # literal ERB tag where the date goes:
  #   Invalid date '<%= Time.now.strftime(...) %>' ... does not have a valid
  #   date in the YAML front matter
  # .gitignore already has `vendor`, but Jekyll does not read .gitignore.
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - yarn.lock
  - postcss.config.js
  - tailwind.config.js
  - .github
  - scripts
  # The committed build output. Jekyll excludes its own destination
  # automatically, so this was a no-op while `destination` was `docs` — it
  # matters as soon as anything builds to `_site`, or `docs/` gets copied into
  # the new build and doubles its size.
  - docs
  # Built locally but never published: `.gitignore` keeps docs/charity,
  # docs/pa and docs/990tools out of the commit, so GitHub Pages has never
  # served them. Excluding them here makes the build match what is live.
  - charity
  - pa
  - 990tools
  - python
  - README.md

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from

whitelist:
  - jekyll-redirect-from